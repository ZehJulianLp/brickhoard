# BrickHoard
server {
    listen 80;
    server_name brickhoard.julianverse.de brickshelf.julianverse.de;

    location / {
        return 301 https://brickhoard.julianverse.de$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name brickhoard.julianverse.de;

    ssl_certificate     /etc/letsencrypt/live/brickhoard.julianverse.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brickhoard.julianverse.de/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:54709;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    add_header Referrer-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}

# Alte Adresse als kompatible Weiterleitung erhalten.
server {
    listen 443 ssl;
    http2 on;
    server_name brickshelf.julianverse.de;

    ssl_certificate     /etc/letsencrypt/live/brickshelf.julianverse.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brickshelf.julianverse.de/privkey.pem;

    return 301 https://brickhoard.julianverse.de$request_uri;
}
